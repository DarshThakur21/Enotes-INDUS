server:
  port: 8080
  servlet:
    context-path: /enotes

app:
  frontend-url: http://localhost:5173

gemini:
  api:
    key:
    url: ${GEMINI_API_URL}

jwt:
  secret: ${JWT_SECRET_KEY}

spring:
  application:
    name: Enotes-INDUS
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: redis
    host: localhost
    port: 6379
    redis:
      time-to-live: 600000

  mail:
    host: smtp.gmail.com
    username: ${SPRING_EMAIL_USERNAME}
    password: ${SPRING_EMAIL_PASSWORD}
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoint:
    shutdown:
      enabled: true

  endpoints:
    web:
      exposure:
        include:
          - '*'
        exclude:
          - beans
          - logger
          - env



file:
  upload:
    path: "notes/"
    pathExcel: "excelstorage/"

email:
  send:
    from: dummysingh2001002@gmail.com


aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    endpoint: ${LOCAL_STACK_HOST}
    region: ${AWS_S3_REGION}
    accessKey: test
    secretKey: test




---


spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          time_zone: UTC

  devtools:
    restart:
      enabled: true
    livereload:
      enabled: true

