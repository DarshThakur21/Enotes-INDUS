server:
  port: 8080
  servlet:
    context-path: /enotes

app:
  frontend-url: http://localhost:5173

gemini:
  api:
    key:
    url: ${GEMINI_API_URL}

jwt:
  secret: ${JWT_SECRET_KEY}

spring:
  application:
    name: Enotes-INDUS
  profiles:
    active: dev

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  cache:
    type: redis
    redis:
      host: enotes-redis
      port: ${REDIS_PORT}
      time-to-live: 600000
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}   # ← use env var, fallback to localhost for local dev
      port: ${REDIS_PORT:6379}

  mail:
    host: smtp.gmail.com
    username: ${SPRING_EMAIL_USERNAME}
    password: ${SPRING_EMAIL_PASSWORD}
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoint:
    shutdown:
      enabled: true

  endpoints:
    web:
      exposure:
        include:
          - '*'
        exclude:
          - beans
          - logger
          - env



file:
  upload:
    path: "notes/"
    pathExcel: "excelstorage/"

email:
  send:
    from: dummysingh2001002@gmail.com


