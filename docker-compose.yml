version: "3.8"

services:
  localstack:
    image: localstack/localstack:latest
    container_name: localstack
    ports:
      - "4566:4566"   # Main LocalStack gateway
    environment:
      - SERVICES=s3,lambda,apigateway,ec2
      - DEFAULT_REGION=us-east-1
      - DEBUG=1
      - PERSISTENCE=1
    volumes:
      - "D:/Project2/Enotes/Enotes-INDUS/s3data:/var/lib/localstack"


